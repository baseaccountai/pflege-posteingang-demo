# `make up-test`: the local stack without any account or key (F11-AC5).
# Test OIDC server (login form: user name + claims, e.g. {"roles": ["nurse_wb1"]}),
# fake OCR and LLM that "read" the documents in samples/, fixed local-only secrets.
x-test-secrets: &test-secrets
  OIDC_ISSUER: http://localhost:18090/default
  OIDC_ROLES_CLAIM: roles
  BFF_API_SECRET: local-bff-api-secret-at-least-32-bytes

services:
  oidc-mock:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    network_mode: host
    environment:
      SERVER_PORT: "18090"
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./oidc-mock:/config:ro

  api:
    environment:
      <<: *test-secrets
      LLM_PROVIDER: fake
      OCR_PROVIDER: fake
      FAKE_OCR_SAMPLES: /samples
      OIDC_AUDIENCE: default
      RAG_MIN_SIMILARITY: "0.1" # fake vectors are only similar through shared words
    volumes:
      - ../samples:/samples:ro
    depends_on:
      - oidc-mock

  web:
    environment:
      <<: *test-secrets
      OIDC_CLIENT_ID: pflege-local
      OIDC_CLIENT_SECRET: local-client-secret
      OIDC_SCOPES: openid profile offline_access
      SESSION_ENC_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
