# Local operation (F11-AC5): web (Next.js BFF) + api (FastAPI) against the local Supabase.
#
#   make up        Supabase (CLI) + web + api, real providers and IdP from ../.env
#   make up-test   additionally the test OIDC server, fake OCR/LLM, fixed local secrets
#                  (docker-compose.test.yml) - no account and no key needed
#   make smoke     checks start page, API with database and the test IdP
#   make down
#
# Host networking: browser, containers and the local Supabase (127.0.0.1:56322) all reach
# each other as "localhost" - the OIDC issuer URL is the same for the browser and the BFF.
# The database login roles use the local-only passwords that the tests set as well.
name: pflege-posteingang

x-local-database: &local-database
  # Local-only passwords (same as apps/api/tests/rls and the e2e run), never used in the cloud.
  DATABASE_URL: postgresql://api_gateway:api_gateway_local_test@127.0.0.1:56322/postgres
  BFF_DATABASE_URL: postgresql://bff_session:bff_session_local_test@127.0.0.1:56322/postgres

services:
  api:
    build: ../apps/api
    network_mode: host
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *local-database
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      OCR_PROVIDER: ${OCR_PROVIDER:-mistral}

  web:
    build: ../apps/web
    network_mode: host
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *local-database
      APP_ORIGIN: http://localhost:3000
      API_BASE_URL: http://127.0.0.1:8000
    depends_on:
      - api
