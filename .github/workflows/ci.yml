name: CI

# F11-AC6: every push (any branch) and every pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Only the database container is needed for the tests.
  SUPABASE_EXCLUDE: gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  web:
    name: Web (lint, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  # RLS and session store against a real Postgres (local Supabase, only the database).
  db:
    name: DB (RLS, session store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase start -x "$SUPABASE_EXCLUDE"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: uv sync --frozen && uv run pytest -m db -v
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile && pnpm test:db
        working-directory: apps/web

  # BFF login end to end: Next.js + test OIDC server (Docker) + local Supabase.
  e2e:
    name: E2E (playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase start -x "$SUPABASE_EXCLUDE"
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Playwright starts the API too (uv run uvicorn), against the same test IdP.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: apps/api
      - run: docker pull ghcr.io/navikt/mock-oauth2-server:2.1.10
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Secret scan over the whole history (F11-AC6, AC10); allowlist: .gitleaks.toml.
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --no-banner --config /repo/.gitleaks.toml

  # The production images build and run: web + api + test IdP like `make up-test`, then the
  # smoke test (F11-AC5). Catches what unit tests cannot see, e.g. a runtime dependency that
  # is only installed for development.
  docker:
    name: Docker (images, local stack, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase start -x "$SUPABASE_EXCLUDE"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen && uv run python -m scripts.local_db_roles
        working-directory: apps/api
      - run: infra/local-stack.sh up-test
      - run: infra/smoke.sh
      - if: failure()
        run: for c in pp-local-api pp-local-web pp-local-oidc; do echo "== $c"; docker logs "$c" 2>&1 | tail -40; done
