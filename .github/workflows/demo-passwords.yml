# F01-AC18: demo users can change their own password in Zitadel (spike S4, ADR 0007).
# This workflow sets the published demo passwords again every 15 minutes.
name: Demo passwords

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-passwords
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only: no dependencies to install.
      - name: Reset demo passwords
        env:
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          ZITADEL_ADMIN_PAT: ${{ secrets.ZITADEL_ADMIN_PAT }}
        run: python3 infra/zitadel/setup.py reset-passwords
