# F10-AC9: Supabase pauses free projects after a week without activity. Every second day
# this asks the API, which asks the database (GET /health/ready, select 1).
# Needs the repository variable API_BASE_URL (public address of the API, not a secret).
name: Keep-alive

on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: API and database answer
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        # The first call may hit a cold start; retry a few times before failing.
        run: curl --fail --silent --show-error --retry 4 --retry-delay 10 --retry-all-errors --max-time 30 "$API_BASE_URL/health/ready"
