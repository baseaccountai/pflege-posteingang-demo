[project]
name = "pflege-posteingang-api"
version = "0.1.0"
description = "Security layer for the Pflege-Posteingang demo (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.10",
    "pypdf>=6.21.2",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
]

# Public hosting on Vercel (ADR 0011): the function loads this ASGI app.
[tool.vercel]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pillow>=13.0.0",
    "pytest>=8.3",
    "reportlab>=5.1.0",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../infra", "../.."]
markers = [
    "db: needs the local Supabase database (make test-db)",
]
addopts = "-m 'not db'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "samples", "tests"]
